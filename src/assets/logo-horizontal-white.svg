<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <!-- Version: Full logo (emblem + text) for DARK THEME on TRANSPARENT background -->
  <g transform="translate(40, 20)">
    <!-- Circular reductionist emblem -->
    <g transform="translate(10, 30)">
      <!-- Base circle cutouts -->
      <mask id="circle-cutout-mask-white">
        <!-- Everything white stays -->
        <rect x="0" y="0" width="400" height="400" fill="#ffffff" />
        <!-- Horizontal slit across middle -->
        <rect x="0" y="190" width="400" height="24" fill="#000000" />
        <!-- Lower horizontal notch -->
        <rect x="0" y="245" width="200" height="15" fill="#000000" />
        <!-- Vertical channel cutout -->
        <rect x="170" y="145" width="30" height="135" fill="#000000" />
      </mask>
      
      <!-- Primary solid circle in crisp white #FFFFFF -->
      <circle cx="200" cy="200" r="180" fill="#FFFFFF" mask="url(#circle-cutout-mask-white)" />
      
      <!-- Interior geometric cantilevered beam forming the abstract 'F' -->
      <path d="M 170 145 L 340 145 L 340 190 L 200 190 L 200 245 L 290 245 L 290 280 L 170 280 Z" fill="#FFFFFF" />
      <path d="M 200 280 L 200 320 L 170 320 L 170 280 Z" fill="#FFFFFF" />

      <!-- Vibrant Tech Cyan (#00BCD4) focal dot -->
      <circle cx="225" cy="168" r="16" fill="#00BCD4" />
    </g>

    <!-- Wordmark 'FinanceApp' in premium white geometry -->
    <text x="470" y="248" font-family="'YogaSansWebPro', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, sans-serif" font-size="94" font-weight="600" fill="#FFFFFF" letter-spacing="-1.5px">FinanceApp</text>
  </g>
</svg>
